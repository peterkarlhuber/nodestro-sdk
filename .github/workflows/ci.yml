name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # CI-FAST AP1: a new push to a pull request cancels the older run of that pull request. Every other run (master
  # push, schedule, dispatch, and the nightly's workflow_call, where github.workflow is "Nightly") gets its own group
  # from github.run_id, so it is never cancelled and never waits behind another run.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 1.9 min, slowest entry 3.13 (successful runs 2026-11-01..07)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # nodestro-api (the test server) is a version range in pyproject.toml; the studio lock pins the exact commits of
      # it and its Nodestro dependencies. pip 26.1 or later applies it to the git requirements.
      - name: Install
        run: |
          python -m pip install "pip>=26.1"
          # A pull request reads the lock of the studio branch with its own name when there is one, else the
          # studio master's; a paired lock is shown as a warning and diffed in the job summary (scripts/studio_lock.sh).
          bash ../scripts/studio_lock.sh "$RUNNER_TEMP/lock.txt"
          echo "lock: $(grep '^nodestro-api' "$RUNNER_TEMP/lock.txt")"
          pip install -c "$RUNNER_TEMP/lock.txt" -e ".[dev,test]"
      - run: ruff check . ../scripts
      - run: ruff format --check . ../scripts
      - run: mypy
      # Against a real Nodestro API with scripted model answers; also checks the committed contract.
      - run: pytest
      - name: The generated types are current
        if: matrix.python == '3.13'
        working-directory: .
        run: |
          python -m nodestro_api.openapi openapi/nodestro-api.json
          (cd typescript && npm ci)
          make generate PYTHON=python
          git diff --exit-code -- openapi python/src/nodestro_client/models.py typescript/src/generated
      - name: The wheel and sdist build and the wheel works without the API installed
        run: |
          python -m pip install build==1.6.1
          python -m build --outdir "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/plain"
          "$RUNNER_TEMP/plain/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/plain/bin/python" -c "import nodestro_client, importlib.util as u; assert u.find_spec('nodestro_api') is None; assert u.find_spec('nodestro_runtime') is None; print(nodestro_client.__version__)"
      # Known vulnerabilities in the installed dependencies (as orkexa's CI checks them). Blocking: an advisory that
      # was reviewed and cannot be fixed yet goes into PIP_AUDIT_IGNORE (space-separated IDs, with the reason here).
      - name: Dependency audit
        if: matrix.python == '3.13'
        env:
          PIP_AUDIT_IGNORE: ""
        run: |
          pip install pip-audit==2.10.1
          args=(); for id in $PIP_AUDIT_IGNORE; do args+=(--ignore-vuln "$id"); done
          pip-audit --skip-editable --progress-spinner off "${args[@]}"

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 2.4 min, slowest entry 22 (successful runs 2026-11-01..07)
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      # The test server only (scripts/test_server.py); the TypeScript SDK needs no Python.
      - name: Install the test server
        run: |
          python -m pip install "pip>=26.1"
          # A pull request reads the lock of the studio branch with its own name when there is one, else the
          # studio master's; a paired lock is shown as a warning and diffed in the job summary (scripts/studio_lock.sh).
          bash scripts/studio_lock.sh "$RUNNER_TEMP/lock.txt"
          echo "lock: $(grep '^nodestro-api' "$RUNNER_TEMP/lock.txt")"
          pip install -c "$RUNNER_TEMP/lock.txt" "./python[test]"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - working-directory: typescript
        run: npm ci
      # Known advisories in the production dependencies of @nodestro/client (blocking).
      - name: Dependency audit (production dependencies)
        if: matrix.node == 22
        working-directory: typescript
        run: npm audit --omit=dev --audit-level=high
      # The development tools too (vitest, the generator): no critical advisory (API2-13, D-04).
      - name: Dependency audit (all dependencies, critical)
        if: matrix.node == 22
        working-directory: typescript
        run: npm audit --audit-level=critical
      - working-directory: typescript
        run: npm run typecheck
      - working-directory: typescript
        run: npm test
        env:
          NODESTRO_SDK_PYTHON: python
      # Builds and packs @nodestro/client, then compiles and runs a strict consumer project against the tarball.
      - run: scripts/check_typescript_package.sh

  # SDK-006: smoke checks of the built package (typescript/smoke/checks.mjs: events with reconnect, streamed
  # downloads, aborts, a published workflow) against the test server, in Node.js, Bun, Deno and in real browsers
  # (Playwright: Chromium, Firefox, WebKit). Linux is required; macOS (WebKit there is the closest to Safari) and
  # Windows are not verified yet and may fail without failing the workflow.
  runtimes:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65 # CI-FAST AP1: p99 41.3 min, slowest entry ubuntu-latest (successful runs 2026-11-01..07)
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the test server
        run: |
          python -m pip install "pip>=26.1"
          # A pull request reads the lock of the studio branch with its own name when there is one, else the
          # studio master's; a paired lock is shown as a warning and diffed in the job summary (scripts/studio_lock.sh).
          bash scripts/studio_lock.sh "$RUNNER_TEMP/lock.txt"
          echo "lock: $(grep '^nodestro-api' "$RUNNER_TEMP/lock.txt")"
          pip install -c "$RUNNER_TEMP/lock.txt" "./python[test]"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - working-directory: typescript
        run: npm ci
      - name: Install the browsers
        working-directory: typescript
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Smoke checks in Node.js, Bun, Deno, Chromium, Firefox and WebKit
        env:
          PYTHON: python
        run: scripts/check_runtimes.sh node bun deno chromium firefox webkit
