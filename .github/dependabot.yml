# Weekly, grouped update pull requests with a small limit. Every action in the workflows is pinned by commit SHA
# (the version is the trailing comment); Dependabot keeps those pins current.
# Python dependencies are left out: pyproject.toml pins the (public) Nodestro components by git commit, and those
# pins move only with the platform's pin cascade (studio scripts/check_versions.py); third-party ranges resolve
# fresh in every CI run, whose blocking pip-audit step catches known vulnerabilities.
# cooldown: a new release is proposed only after a few days (a week for majors), so a broken or compromised release
# is usually withdrawn before it reaches a pull request; security updates are not delayed. Merging stays manual
# (no auto-merge; nodestro-studio docs/TODO.md ST-052).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # TypeScript 7 breaks openapi-typescript (SDK-009); @types/node follows the lowest supported Node major (SDK-010);
    # Vitest 5 supports only Node.js ^22.12, ^24 and >=26, while the SDK still supports and tests Node.js 20 (SDK-010).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
